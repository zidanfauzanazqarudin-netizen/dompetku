<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Dompetku — Expense Tracker</title><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--danger:#dc2626;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:620px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}
header{padding:22px 4px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.month{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.summary{background:var(--accent);color:#fff;border-radius:24px;padding:22px;margin:6px 0 16px;box-shadow:0 8px 25px #0001}.summary .label{font-size:13px;opacity:.7}.total{font-size:34px;font-weight:750;margin:5px 0 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#ffffff12;border-radius:15px;padding:12px}.stat small{opacity:.65}.stat b{display:block;margin-top:5px;font-size:17px}
.section{margin:18px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section h2{font-size:18px;margin:0}.link{background:none;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.cat{padding:12px 5px;border-radius:16px;background:#f8f8f9;text-align:center}.emoji{font-size:22px}.cat small{display:block;margin-top:4px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.icon{width:42px;height:42px;border-radius:14px;background:#f1f2f4;display:grid;place-items:center;font-size:20px}.txmain{flex:1;min-width:0}.txmain b,.txmain span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.txmain span{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:700}.empty{text-align:center;color:var(--muted);padding:25px 8px;font-size:14px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(15px);border-top:1px solid var(--line)}.bottom-inner{max-width:620px;margin:auto;display:flex;gap:10px}.add{flex:1;background:var(--accent);color:#fff;padding:15px;border-radius:17px;font-weight:700;font-size:16px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:620px;margin:auto;border-radius:25px 25px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheet h2{margin:0}.close{background:#f0f1f3;border-radius:50%;width:34px;height:34px}
label{display:block;font-size:13px;font-weight:600;margin:13px 0 7px}.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fafafa;outline:0}.field:focus{border-color:#9ca3af;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save{width:100%;padding:15px;border-radius:15px;background:var(--accent);color:#fff;font-weight:700;margin-top:18px}
.barrow{margin:13px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}.track{height:9px;background:#eef0f2;border-radius:10px;overflow:hidden}.bar{height:100%;background:#111827;border-radius:10px}
.danger{color:var(--danger);background:none;padding:5px}.filter{display:flex;gap:8px;overflow:auto;margin-bottom:10px}.filter button{white-space:nowrap;background:#f0f1f3;padding:8px 12px;border-radius:12px;font-size:12px}.filter button.active{background:#111827;color:#fff}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Dompetku</h1><div class="sub">Catat pengeluaran tanpa ribet.</div></div><div style="display:flex;gap:8px;align-items:center"><button class="link" onclick="document.getElementById('importFile').click()">Import</button><button class="link" onclick="showExportMenu()">Export</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"><input id="month" class="month" type="month"></div></header>
<div class="summary"><div class="label">Pengeluaran bulan ini</div><div id="total" class="total">Rp0</div><div class="stats"><div class="stat"><small>Transaksi</small><b id="count">0</b></div><div class="stat"><small>Rata-rata</small><b id="avg">Rp0</b></div></div></div>
<div class="section"><div class="section-head"><h2>Kategori</h2><button class="link" onclick="openAnalytics()">Lihat analisis →</button></div><div id="cats" class="card categories"></div></div>
<div class="section"><div class="section-head"><h2>Transaksi terbaru</h2><button class="link" onclick="openHistory()">Lihat semua →</button></div><div id="recent" class="card"></div></div>
</div>
<div class="bottom"><div class="bottom-inner"><button class="add" onclick="openAdd()">＋ Tambah Pengeluaran</button></div></div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const CATS={Makan:"🍜",Transportasi:"🛵",Belanja:"🛍️",Hiburan:"🎮",Tagihan:"💡",Kesehatan:"💊",Pendidikan:"📚",Lainnya:"📦"};
let data=JSON.parse(localStorage.getItem("dompetku_tx")||"[]");
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
const fmtDate=s=>new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
function save(){localStorage.setItem("dompetku_tx",JSON.stringify(data))}
function monthNow(){return new Date().toISOString().slice(0,7)}
document.getElementById("month").value=monthNow();document.getElementById("month").onchange=render;
function current(){return document.getElementById("month").value||monthNow()}
function filtered(){return data.filter(x=>x.date.startsWith(current())).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created)}
function render(){let xs=filtered(),total=xs.reduce((s,x)=>s+x.amount,0);totalEl("total",rupiah(total));totalEl("count",xs.length);totalEl("avg",rupiah(xs.length?total/xs.length:0));let by={};xs.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);document.getElementById("cats").innerHTML=Object.keys(CATS).map(c=>`<div class="cat"><div class="emoji">${CATS[c]}</div><small>${c}</small><b>${rupiah(by[c]||0).replace("Rp","")}</b></div>`).join("");document.getElementById("recent").innerHTML=xs.slice(0,7).map(txHTML).join("")||'<div class="empty">Belum ada pengeluaran bulan ini.<br>Tap tombol di bawah untuk mulai.</div>'}
function totalEl(id,v){document.getElementById(id).textContent=v}
function txHTML(x){return `<div class="tx"><div class="icon">${CATS[x.cat]||"📦"}</div><div class="txmain"><b>${esc(x.note||x.cat)}</b><span>${x.cat} · ${fmtDate(x.date)}${x.method?" · "+x.method:""}</span></div><div class="amount">${rupiah(x.amount)}</div></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function openAdd(edit=null){const x=edit||{date:new Date().toISOString().slice(0,10),cat:"Makan",amount:"",note:"",method:"Cash"};document.getElementById("sheet").innerHTML=`<div class="sheet-head"><h2>${edit?"Edit":"Tambah"} Pengeluaran</h2><button class="close" onclick="closeModal()">×</button></div><label>Nominal</label><input id="fAmount" class="field" inputmode="numeric" type="number" min="0" placeholder="Contoh: 25000" value="${x.amount}"><div class="grid2"><div><label>Kategori</label><select id="fCat" class="field">${Object.keys(CATS).map(c=>`<option ${x.cat===c?"selected":""}>${c}</option>`).join("")}</select></div><div><label>Tanggal</label><input id="fDate" class="field" type="date" value="${x.date}"></div></div><label>Metode pembayaran</label><select id="fMethod" class="field">${["Cash","Debit","QRIS","Transfer","Lainnya"].map(c=>`<option ${x.method===c?"selected":""}>${c}</option>`).join("")}</select><label>Catatan</label><input id="fNote" class="field" maxlength="80" placeholder="Contoh: makan siang" value="${esc(x.note||"")}"><button class="save" onclick='submitTx(${edit?JSON.stringify(edit.id):"null"})'>Simpan Pengeluaran</button>`;showModal()}
function submitTx(id){let amount=Number(document.getElementById("fAmount").value);if(!amount||amount<0)return alert("Masukkan nominal yang valid.");let x={id:id||crypto.randomUUID(),amount,cat:document.getElementById("fCat").value,date:document.getElementById("fDate").value,method:document.getElementById("fMethod").value,note:document.getElementById("fNote").value.trim(),created:Date.now()};if(id){let i=data.findIndex(a=>a.id===id);if(i>=0)data[i]={...data[i],...x}}else data.push(x);save();closeModal();render()}
function openHistory(){document.getElementById("sheet").innerHTML=`<div class="sheet-head"><h2>Semua Transaksi</h2><button class="close" onclick="closeModal()">×</button></div><div class="filter"><button class="active" onclick="historyFilter(this,'all')">Semua</button>${Object.keys(CATS).map(c=>`<button onclick="historyFilter(this,'${c}')">${CATS[c]} ${c}</button>`).join("")}</div><div id="historyList"></div>`;showModal();historyFilter(null,"all")}
function historyFilter(btn,cat){if(btn){document.querySelectorAll(".filter button").forEach(b=>b.classList.remove("active"));btn.classList.add("active")}let xs=filtered().filter(x=>cat==="all"||x.cat===cat);document.getElementById("historyList").innerHTML=xs.map(x=>txHTML(x)+`<div style="text-align:right"><button class="danger" onclick='openAdd(${JSON.stringify(x)})'>Edit</button><button class="danger" onclick='removeTx("${x.id}")'>Hapus</button></div>`).join("")||'<div class="empty">Tidak ada transaksi.</div>'}
function removeTx(id){if(confirm("Hapus transaksi ini?")){data=data.filter(x=>x.id!==id);save();openHistory();render()}}
function openAnalytics(){let xs=filtered(),by={};xs.forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);let max=Math.max(...Object.values(by),1),total=xs.reduce((s,x)=>s+x.amount,0);document.getElementById("sheet").innerHTML=`<div class="sheet-head"><h2>Analisis ${current()}</h2><button class="close" onclick="closeModal()">×</button></div><div class="card"><b>Total: ${rupiah(total)}</b>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="barrow"><div class="barlabel"><span>${CATS[c]} ${c}</span><b>${rupiah(v)}</b></div><div class="track"><div class="bar" style="width:${v/max*100}%"></div></div></div>`).join("")||'<div class="empty">Belum ada data.</div>'}</div>`;showModal()}
function showModal(){document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}
async function importData(file){if(!file)return;try{const text=await file.text();const incoming=JSON.parse(text);if(!Array.isArray(incoming))throw new Error("Format data bukan array.");const valid=incoming.filter(x=>x&&Number.isFinite(Number(x.amount))&&x.date&&x.cat);if(!valid.length)throw new Error("Tidak ada transaksi valid.");const existing=new Map(data.map(x=>[x.id,x]));valid.forEach(x=>{const id=String(x.id||crypto.randomUUID());existing.set(id,{id,amount:Number(x.amount),cat:String(x.cat),date:String(x.date),method:String(x.method||"Lainnya"),note:String(x.note||""),created:Number(x.created||Date.now())})});data=Array.from(existing.values());save();render();alert(`Berhasil import ${valid.length} transaksi ke Dompetku.`)}catch(e){alert("Import gagal: "+e.message)}finally{document.getElementById("importFile").value=""}}
function exportData(){if(!data.length)return alert("Belum ada data untuk diexport.");const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`Dompetku_Backup_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){if(!data.length)return alert("Belum ada data untuk diexport.");const rows=[["Tanggal","Kategori","Metode","Nominal","Catatan"]];[...data].sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(x=>rows.push([x.date,CATS[x.cat]||x.cat,x.method||"Lainnya",x.amount,x.note||""]));const csv="\uFEFF"+rows.map(row=>row.map(v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`Dompetku_Pengeluaran_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
</script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
<div id="exportMenu" class="modal" style="display:none;">
  <div class="modal-card">
    <div class="modal-head">
      <strong>Export Data</strong>
      <button class="link" onclick="closeExportMenu()">Tutup</button>
    </div>
    <p style="margin:0 0 14px;color:#6b7280;">Pilih format file yang ingin diekspor.</p>
    <div style="display:grid;gap:10px;">
      <button class="primary" onclick="exportData();closeExportMenu();">JSON — Backup Dompetku</button>
      <button class="primary" onclick="exportCSV();closeExportMenu();">CSV — Buka di Excel</button>
    </div>
  </div>
</div>

<script>
function showExportMenu(){
  document.getElementById("exportMenu").style.display="flex";
}
function closeExportMenu(){
  document.getElementById("exportMenu").style.display="none";
}
document.getElementById("exportMenu")?.addEventListener("click",function(e){
  if(e.target===this) closeExportMenu();
});
</script>

</body></html>
